services:
  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/amd64  # <-- ADDED: Run amd64 image via Rosetta 2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5

  tgi:
    image: ghcr.io/huggingface/text-generation-inference:latest
    platform: linux/amd64  # <-- ADDED: Run amd64 image via Rosetta 2
    ports:
      - "8080:8080"
    volumes:
      - tgi_data:/data
    env_file: .env
    environment:
      - MODEL_ID=${TGI_MODEL}
      - PORT=8080
      - QUANTIZE=bitsandbytes-nf4
    networks:
      - rag-network
    restart: unless-stopped
    # --- REMOVED this entire 'deploy' block ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    # ----------------------------------------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s # Give 5 mins for model to download

  init-db:
    build:
      context: .
      dockerfile: docker/Dockerfile.base
    command: python -m src.init_db
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - rag-network
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: docker/Dockerfile.ingest
    env_file: .env
    depends_on:
      init-db:
        condition: service_completed_successfully
      tgi:
        condition: service_healthy
    networks:
      - rag-network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
      tgi:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------------------------------
  # OBSERVABILITY SERVICES (no changes needed)
  # -----------------------------------------------------------------

  loki:
    image: grafana/loki:2.9.2
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - rag-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail/promtail-config.yml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - rag-network
    restart: unless-stopped
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:v2.47.2
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command: --config.file=/etc/prometheus/prometheus.yml
    networks:
      - rag-network
    restart: unless-stopped
    depends_on:
      - api

  grafana:
    image: grafana/grafana:10.1.5
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - rag-network
    restart: unless-stopped
    depends_on:
      - loki
      - prometheus

volumes:
  qdrant_data:
  tgi_data:
  grafana_data:

networks:
  rag-network:
    driver: bridge